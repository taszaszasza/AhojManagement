services:
  backend:
    build:
      context: ./Server
      dockerfile: Dockerfile
    restart: always
    ports:
      # Maps host port 8001 -> container port 5000
      - "8001:5000"

  frontend:
    build:
      context: ./Client
      dockerfile: Dockerfile
    restart: always
    ports:
      # Maps host port 8080 -> container port 8080
      - "8080:8080"
    depends_on:
      - backend